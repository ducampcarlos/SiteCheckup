[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sitecheckup"
dynamic = ["version"]
description = "Passive website security audit and post-migration comparison tool."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Carlos Ducamp" }]
keywords = ["security", "audit", "migration", "wordpress", "headers", "seo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.7",
    "pydantic>=2.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "build>=1.2",
]

[project.scripts]
sitecheckup = "sitecheckup.cli:app"

[project.urls]
Homepage = "https://github.com/ducampcarlos/SiteCheckup"
Issues = "https://github.com/ducampcarlos/SiteCheckup/issues"
Changelog = "https://github.com/ducampcarlos/SiteCheckup/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sitecheckup/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sitecheckup"]

[tool.hatch.build.targets.sdist]
include = ["src/sitecheckup", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "S", "PL"]
ignore = [
    "E501",    # the formatter handles code; long prose strings and URLs are fine
    "PLR2004", # magic values are fine for HTTP status codes and thresholds
    "PLR0911", # many returns are clearer than nesting in check code
    "PLR0912",
    "PLR0913",
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT018", "S101", "S105", "S106", "S108", "PLR2004"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=sitecheckup --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["sitecheckup"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
