# Demo "new" site: a freshly migrated copy with a handful of documented regressions.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'" always;
    # Intentional regression: X-Frame-Options (present on the legacy site) was dropped.

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Intentional regression: a three-hop redirect chain for /specials.
    location = /specials { return 301 /offers; }
    location = /offers   { return 301 /offers/; }
    location = /offers/  { return 301 /deals; }

    # Intentional regression: the gallery page is throttled to simulate a slow backend.
    location = /gallery {
        limit_rate_after 1k;
        limit_rate 3k;
        try_files /gallery.html =404;
    }
}
