# Demo "legacy" site: deliberately weak so `sitecheckup audit` has things to report.
# Everything here is invented and bound to localhost; never deploy this configuration.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    absolute_redirect off;   # redirects use relative Location headers, so port mappings do not matter

    # Intentional weaknesses ------------------------------------------------
    server_tokens on;                                   # Server header leaks the nginx version
    add_header X-Powered-By "PHP/7.4.33" always;        # banner header (invented)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Set-Cookie "session_hint=demo-visitor; Path=/" always;  # no Secure/HttpOnly/SameSite
    # (no CSP, no Referrer-Policy, no Permissions-Policy, no security.txt, plain HTTP only)

    # Clean URLs: /about -> about.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Fake "leaked" files. They are served from memory so no secrets-looking
    # file has to live in the repository.
    location = /.env {
        default_type text/plain;
        return 200 "APP_ENV=production\nAPP_KEY=FAKE-DEMO-VALUE-NOT-A-SECRET\nDB_PASSWORD=not-a-real-password\n";
    }
    location = /backup.sql {
        default_type text/plain;
        return 200 "-- MySQL dump (fake demo data)\nCREATE TABLE customers (id INT, name VARCHAR(40));\nINSERT INTO customers VALUES (1, 'Example Customer');\n";
    }
    location /uploads/ {
        autoindex on;                                   # directory listing enabled
    }
}
